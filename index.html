<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discipline Tracker</title>
<style>
:root{--bg:#0b0d10;--card:#13171c;--card2:#1a2027;--text:#f2f4f7;--muted:#98a2b3;--line:#29313a;--accent:#e6edf3;--good:#8ee6a8;--bad:#ff8f8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:850px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
h1,h2,h3,p{margin-top:0}.brand{font-weight:800;letter-spacing:-.5px}.muted{color:var(--muted)}
.btn{background:var(--accent);color:#0b0d10;padding:11px 15px;border-radius:10px;font-weight:700}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#321a1a;color:#ffb0b0;border:1px solid #5a2929}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hero{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}
.progress{height:9px;background:#252c33;border-radius:99px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;background:var(--good);width:0}
.day{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:start}.daynum{font-weight:800}.date{font-size:12px;color:var(--muted);margin-top:3px}
.check{width:28px;height:28px;border-radius:8px;background:transparent;border:1px solid #46505a;color:var(--good);font-weight:900}.check.done{background:#173a24;border-color:#39774d}
textarea,input{width:100%;background:#0e1216;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}textarea{min-height:78px;resize:vertical;margin-top:10px}
.row{display:flex;gap:9px;flex-wrap:wrap}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.small{font-size:12px}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:16px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.challenge{display:flex;justify-content:space-between;align-items:center;gap:12px}.challenge h3{margin-bottom:5px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:58px 1fr auto}.app{padding:18px 12px 50px}.top{align-items:flex-start}}

.taskgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.task{background:#0e1216;color:#aeb8c4;border:1px solid #303943;border-radius:9px;padding:9px 8px;text-align:left;font-size:12px}
.task.ok{background:#173a24;border-color:#39774d;color:#9cebb2}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start}.scoreline{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:#98a2b3}.scoreline strong{color:#f2f4f7}.section{margin:22px 4px 10px}
@media(max-width:600px){.taskgrid{grid-template-columns:repeat(2,1fr)}.scoreline{display:block}.scoreline strong{display:block;margin-top:4px}}

.motivation{border-left:3px solid var(--good);background:linear-gradient(135deg,#151b20,#11161b)}
.motivation-label{font-size:11px;letter-spacing:1.5px;color:var(--good);font-weight:800;margin-bottom:8px}
.motivation #quote{font-size:19px;line-height:1.4;font-weight:750;letter-spacing:-.2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">DISCIPLINE TRACKER</div><div class="muted small" id="hello"></div></div>
    <div class="row"><button class="btn secondary" onclick="downloadJSON()">↓ Export JSON</button><button class="btn" onclick="openModal()">+ New</button></div>
  </div>
  <div id="screen"></div>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="modalTitle">New challenge</h2>
  <p class="muted">Set it once. The tracker handles the rest.</p>
  <div class="field"><label>Your name</label><input id="name" placeholder="Enter your name"></div>
  <div class="field"><label>Challenge name</label><input id="challengeName" placeholder="e.g. Discipline Protocol"></div>
  <div class="field"><label>Number of days</label><input id="days" type="number" min="1" max="3650" placeholder="21"></div>
  <div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="createChallenge()">Start</button></div>
 </div>
</div>

<script>
const KEY='discipline_tracker_v2';
let data=JSON.parse(localStorage.getItem(KEY)||'{"name":"","challenges":[],"active":null}');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(d){return new Date(d).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function todayKey(){let d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('name').value=data.name||'';document.getElementById('challengeName').value='';document.getElementById('days').value=''}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function createChallenge(){
 const name=document.getElementById('name').value.trim(), title=document.getElementById('challengeName').value.trim()||'My Challenge';
 const days=Math.max(1,Math.min(3650,parseInt(document.getElementById('days').value,10)||21));
 if(!name){alert('Enter your name.');return}
 data.name=name; const start=new Date(); start.setHours(0,0,0,0);
 const entries=Array.from({length:days},(_,i)=>({day:i+1,date:new Date(start.getTime()+i*86400000).toISOString(),done:false,note:'',tasks:{wake:false,exercise:false,deep:false,phone:false,learn:false,sleep:false}}));
 const ch={id:crypto.randomUUID(),title,days,start:start.toISOString(),entries,streak:0};
 data.challenges.unshift(ch);data.active=ch.id;save();closeModal();render();
}
function active(){return data.challenges.find(x=>x.id===data.active)}
function setActive(id){data.active=id;save();render()}
function del(id){let c=data.challenges.find(x=>x.id===id);if(confirm(`Delete "${c?.title}"? This cannot be undone.`)){data.challenges=data.challenges.filter(x=>x.id!==id);data.active=data.challenges[0]?.id||null;save();render()}}
function calc(c){
 let completed=0,taskDone=0,taskTotal=0;
 c.entries.forEach(e=>{if(e.done)completed++; Object.values(e.tasks||{}).forEach(v=>{taskTotal++;if(v)taskDone++})});
 let pct=c.days?Math.round(completed/c.days*100):0;
 let taskPct=taskTotal?Math.round(taskDone/taskTotal*100):0;
 let streak=0;
 for(let i=0;i<c.entries.length;i++){if(c.entries[i].done)streak++;else if(new Date(c.entries[i].date)>new Date())continue;else break}
 return {completed,remaining:c.days-completed,pct,taskDone,taskTotal,taskPct,streak};
}
function toggleDone(i){let c=active();c.entries[i].done=!c.entries[i].done;save();render()}
function toggleTask(i,k){let c=active();c.entries[i].tasks[k]=!c.entries[i].tasks[k];save();render()}
function note(i,v){active().entries[i].note=v;save()}
function markAllToday(){
 let c=active(), idx=c.entries.findIndex(e=>e.date.slice(0,10)===todayKey());
 if(idx<0){alert('Today is outside this challenge.');return}
 Object.keys(c.entries[idx].tasks).forEach(k=>c.entries[idx].tasks[k]=true);c.entries[idx].done=true;save();render();
}


function downloadJSON(){
 const exportedAt=new Date().toISOString();
 const systemPrompt=`You are a brutally honest personal discipline analyst and performance coach. Analyze the attached JSON tracker data objectively. Do not flatter the user and do not invent facts.

Your job:
1. Identify the user's strongest and weakest habits from the actual data.
2. Find patterns in missed days, incomplete habits, notes, streaks, and repeated problems.
3. Distinguish facts shown by the data from reasonable interpretations.
4. Identify the 3 biggest behaviors currently holding the user back.
5. Look for excuses, recurring triggers, avoidance patterns, inconsistency, or self-sabotaging loops if the notes support them.
6. Give practical corrective actions that are specific enough to execute tomorrow.
7. Create a simple 7-day correction plan based on the weakest areas.
8. Tell the user what NOT to focus on yet if they are trying to change too many things.
9. Be direct. If the user is doing poorly, say so clearly. If they are improving, explain exactly what the data proves.
10. Never diagnose mental or medical conditions. If a note suggests a health or safety issue, recommend appropriate professional help rather than diagnosing.

Use this response structure:
- EXECUTIVE VERDICT
- WHAT THE DATA SAYS
- WHERE I AM GOING WRONG
- MY 3 BIGGEST PROBLEMS
- PATTERNS/TRIGGERS
- WHAT I SHOULD CHANGE
- 7-DAY CORRECTION PLAN
- ONE RULE FOR TOMORROW
- FINAL SCORECARD

Important: Base your analysis primarily on the exported tracker data. Do not pretend to know anything that is not in the file.`;

 const payload={
   file_type:"discipline_tracker_export",
   version:"2.0",
   exported_at:exportedAt,
   system_prompt:systemPrompt,
   user_profile:{name:data.name},
   challenges:data.challenges,
   analysis_instructions:"Give the JSON file to an AI model together with the system_prompt above. Ask it to analyze my discipline performance using the required response structure."
 };
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=`discipline-tracker-${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function motivation(){
 const quotes=[
  "Discipline is choosing what you want most over what you want right now.",
  "Nobody is coming to build your life for you. Get up and do the work.",
  "You don't need a perfect day. You need one honest day repeated.",
  "The version of you that you want is built by what you do when nobody is watching.",
  "Don't negotiate with the habit you are trying to break.",
  "A bad moment is not a bad day. Reset and continue.",
  "Your future self is watching what you do today.",
  "Control your attention and you control the direction of your life.",
  "You said you would do it. Now prove it to yourself.",
  "Small promises kept daily become self-respect."
 ];
 return quotes[Math.floor(Date.now()/86400000)%quotes.length];
}
function render(){
 const s=document.getElementById('screen');document.getElementById('hello').textContent=data.name?`For ${data.name}`:'';
 if(!data.challenges.length){s.innerHTML='<div class="empty"><h2>Start your first challenge</h2><p class="muted">Create a challenge, choose its length, then track every day.</p><button class="btn" onclick="openModal()">Start challenge</button></div>';return}
 const c=active(), x=calc(c);
 let challengeBtns=data.challenges.map(q=>`<button class="btn ${q.id===c.id?'':'secondary'}" onclick="setActive('${q.id}')">${esc(q.title)}</button>`).join('');
 let rows=c.entries.map((e,i)=>{
   let keys=[['wake','Wake on time'],['exercise','Exercise'],['deep','Deep work'],['phone','Phone control'],['learn','Learn'],['noporn','No porn'],['sleep','Sleep on time']];
   let task=keys.map(([k,l])=>`<button class="task ${e.tasks[k]?'ok':''}" onclick="toggleTask(${i},'${k}')">${e.tasks[k]?'✓':'○'} ${l}</button>`).join('');
   return `<div class="card day"><div class="dayhead"><div><div class="daynum">DAY ${e.day}</div><div class="date">${fmt(e.date)}</div></div><button class="check ${e.done?'done':''}" onclick="toggleDone(${i})">${e.done?'✓':''}</button></div><div class="taskgrid">${task}</div><textarea placeholder="What went wrong? What did I learn? What will I fix tomorrow?" oninput="note(${i},this.value)">${esc(e.note)}</textarea></div>`;
 }).join('');
 s.innerHTML=`<div class="card"><div class="challenge"><div><h2>${esc(c.title)}</h2><div class="muted">${c.days} days · started ${fmt(c.start)}</div></div><button class="btn danger" onclick="del('${c.id}')">Delete</button></div>
 <div class="stats">
 <div class="stat"><b>${x.completed}/${c.days}</b><span>Days completed</span></div>
 <div class="stat"><b>${x.pct}%</b><span>Challenge score</span></div>
 <div class="stat"><b>${x.taskPct}%</b><span>Habit score</span></div>
 <div class="stat"><b>${x.streak}</b><span>Current streak</span></div>
 </div><div class="progress"><i style="width:${x.pct}%"></i></div>
 <div class="scoreline"><span>Overall scoreboard</span><strong>${x.completed} days • ${x.taskDone}/${x.taskTotal} habits</strong></div></div>
 <div class="card"><div class="row">${challengeBtns}</div><div class="actions"><button class="btn" onclick="markAllToday()">✓ Complete today</button><button class="btn secondary" onclick="openModal()">+ New challenge</button></div>
 <div class="muted small" style="margin-top:12px">Export JSON saves your tracker data plus an AI analysis system prompt, so another AI can review your progress and tell you where you're going wrong.</div></div>
 <div class="card motivation">
 <div class="motivation-label">TODAY'S MINDSET</div>
 <div id="quote">${motivation()}</div>
 <div class="muted small" style="margin-top:8px">You do not need to feel motivated. You need to keep the promise you made to yourself.</div>
 </div>
 <h3 class="section">Daily scoreboard</h3>${rows}`;
}
render();
</script>
</body>
</html>
